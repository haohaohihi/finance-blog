colorScheme = "potato"
defaultAppearance = "dark"
autoSwitchAppearance = true

[umamiAnalytics]
  websiteid = "bc351e8c-79ae-4710-80d6-841275853f36"

enableSearch = true
enableCodeCopy = true

mainSections = ["posts"]
showViews = true
showLikes = false

[homepage]
  layout = "background"
  showRecent = true
  showRecentItems = 6
  showMoreLink = false
  showReadingTime = true
  cardView = true

[article]
  showDate = true
  showViews = true
  showLikes = false
  showDateUpdated = false
  showAuthor = true
  showHero = false
  heroStyle = "basic"
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showSummary = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = true
  showComments = false

[list]
  showViews = true
  showLikes = false
  showTableOfContents = false
  layoutBackgroundHeaderSpace = true
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  showCards = true
  groupByYear = false
  cardView = true
  cardViewScreenWidth = true

[sitemap]
  excludedKinds = []

[taxonomy]
  showTermCount = true

[author]
  name = "Alex"
  headline = "Smart money for regular people"
  bio = "Personal finance enthusiast helping regular people build wealth, one potato at a time."

  [[author.links]]
    youtube = "https://www.youtube.com/@PotatoMoneyHQ"
